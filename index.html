<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>길드명찰 색상 시뮬</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;
        background: #1e1e1e;
        color: white;
        font-family: Arial, sans-serif;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .top-buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .select-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        font-size: 15px;
      }

      .select-btn.active {
        background: #4f8cff;
      }

      .image-wrapper {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 40px;
      }

      .image-box {
        position: relative;
        width: 380px;
        background: #2b2b2b;
        border-radius: 16px;
        overflow: hidden;
        padding: 12px;
        text-align: center;
      }

      .image-box h3 {
        text-align: center;
        margin-top: 0;
      }

      .controls {
        width: 700px;
        max-width: 95vw;
        margin: auto;
        background: #2b2b2b;
        padding: 24px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }

      .text {
        display: flex;
        position: absolute;
        top: 262px;
        left: 161px;
      }

      .frame {
        display: flex;
        position: absolute;
        top: 256px;
        left: 157px;
      }

      .bg {
        display: flex;
        position: absolute;
        top: 256px;
        left: 157px;
        opacity: 0.6;
      }

      

      input[type="range"] {
        width: 100%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>길드명찰 색상 시뮬</h1>

    <!-- 어떤 사진을 조절할지 선택 -->
    <div class="top-buttons">
      <button class="select-btn active" data-target="img1">배경</button>

      <button class="select-btn" data-target="img2">글자</button>

      <button class="select-btn" data-target="img3">테두리</button>
    </div>

    <!-- 이미지 -->
    <div class="image-wrapper">
      <div class="image-box">
        <img id="img0" src="./img/char.png" />
        <img id="img1" src="./img/bg.png" class="bg" />
        <img id="img2" src="img/text.png" class="text" />
        <img id="img3" src="img/frame.png" class="frame" />
      </div>
    </div>

    <!-- 슬라이더 -->
    <div class="controls">
      <!-- 색상 -->
      <div class="control-group">
        <div class="label-row">
          <span>색상</span>
          <span id="hueValue">0°</span>
        </div>

        <input type="range" id="hue" min="0" max="360" value="0" />
      </div>

      <!-- 채도 -->
      <div class="control-group">
        <div class="label-row">
          <span>채도</span>
          <span id="saturationValue">100%</span>
        </div>

        <input type="range" id="saturation" min="0" max="300" value="100" />
      </div>

      <!-- 밝기 -->
      <div class="control-group">
        <div class="label-row">
          <span>밝기</span>
          <span id="brightnessValue">100%</span>
        </div>

        <input type="range" id="brightness" min="0" max="300" value="100" />
      </div>
    </div>

    <script>
      // 이미지 상태 저장
      const imageSettings = {
        img1: {
          hue: 0,
          brightness: 100,
          saturation: 100,
        },
        img2: {
          hue: 0,
          brightness: 100,
          saturation: 100,
        },
        img3: {
          hue: 0,
          brightness: 100,
          saturation: 100,
        },
      };

      // 현재 선택된 이미지
      let currentImageId = "img1";

      // 요소 가져오기
      const hue = document.getElementById("hue");
      const brightness = document.getElementById("brightness");
      const saturation = document.getElementById("saturation");

      const hueValue = document.getElementById("hueValue");
      const brightnessValue = document.getElementById("brightnessValue");
      const saturationValue = document.getElementById("saturationValue");

      const buttons = document.querySelectorAll(".select-btn");

      // 필터 적용
      function applyFilter(imageId) {
        const img = document.getElementById(imageId);
        const setting = imageSettings[imageId];

        img.style.filter = `
        hue-rotate(${setting.hue}deg)
        brightness(${setting.brightness}%)
        contrast(${setting.brightness}%)
        saturate(${setting.saturation}%)
      `;
      }

      // 슬라이더 UI 갱신
      function updateSliderUI() {
        const setting = imageSettings[currentImageId];

        hue.value = setting.hue;
        brightness.value = setting.brightness;
        saturation.value = setting.saturation;

        hueValue.textContent = `${setting.hue}°`;
        brightnessValue.textContent = `${setting.brightness}%`;
        saturationValue.textContent = `${setting.saturation}%`;
      }

      // 슬라이더 변경 시
      function onSliderChange() {
        imageSettings[currentImageId] = {
          hue: hue.value,
          brightness: brightness.value,
          saturation: saturation.value,
        };

        updateSliderUI();
        applyFilter(currentImageId);
      }

      // 버튼 클릭
      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          // 버튼 active 변경
          buttons.forEach((btn) => {
            btn.classList.remove("active");
          });

          button.classList.add("active");

          // 현재 이미지 변경
          currentImageId = button.dataset.target;

          // 슬라이더 값 갱신
          updateSliderUI();
        });
      });

      // 슬라이더 이벤트
      hue.addEventListener("input", onSliderChange);
      brightness.addEventListener("input", onSliderChange);
      saturation.addEventListener("input", onSliderChange);

      // 초기 적용
      applyFilter("img1");
      applyFilter("img2");
      applyFilter("img3");

      updateSliderUI();
    </script>
  </body>
</html>
