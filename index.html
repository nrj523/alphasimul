<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>알파 길드명찰 색상 시뮬</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;
        background: #1e1e1e;
        color: white;
        font-family: Arial, sans-serif;
      }

      #hue::-webkit-slider-thumb,
      #saturation::-webkit-slider-thumb,
      #brightness::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #666;
        margin-top: -8px;
        cursor: pointer;
      }
      #hue::-webkit-slider-runnable-track,
      #saturation::-webkit-slider-runnable-track,
      #brightness::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 8px;
      }

      #hue::-moz-range-track,
      #saturation::-moz-range-track,
      #brightness::-moz-range-track {
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(
          90deg,
          red 0,
          #ff0 17%,
          lime 33%,
          cyan 50%,
          blue 66%,
          #f0f 83%,
          red
        );
      }
      #saturation::-moz-range-track {
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(90deg, #959595 0, red);
      }
      #brightness::-moz-range-track {
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(90deg, black 0, white);
      }
      #hue::-moz-range-thumb,
      #saturation::-moz-range-thumb,
      #brightness::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #666;
        cursor: pointer;
      }

      #hue::-ms-track,
      #saturation::-ms-track,
      #brightness::-ms-track {
        width: 100%;
        height: 8px;
        background: transparent;
        color: transparent;
      }
      #hue::-ms-fill-lower,
      #hue::-ms-fill-upper {
        background-image: linear-gradient(
          90deg,
          red 0,
          #ff0 17%,
          lime 33%,
          cyan 50%,
          blue 66%,
          #f0f 83%,
          red
        );
        border-radius: 8px;
      }
      #saturation::-ms-fill-lower,
      #saturation::-ms-fill-upper {
        background-image: linear-gradient(90deg, #959595 0, red);
        border-radius: 8px;
      }
      #brightness::-ms-fill-lower,
      #brightness::-ms-fill-upper {
        background-image: linear-gradient(90deg, black 0, white);
        border-radius: 8px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .top-buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .select-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        font-size: 15px;
      }

      .select-btn2 {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        font-size: 15px;
      }

      .zoom-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        font-size: 15px;
      }

      .select-btn.active {
        background: #4f8cff;
      }

      .image-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-bottom: 40px;
      }

      .image-box {
        position: relative;
        width: 380px;
        background: #2b2b2b;
        border-radius: 16px;
        overflow: hidden;
        padding: 12px;
        text-align: center;
      }

      .control-box {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .controls {
        width: 400px;
        max-width: 95vw;
        margin: auto;
        background: #2b2b2b;
        padding: 24px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }

      .image-box img {
        image-rendering: pixelated;
      }

      .layer {
        position: absolute;
        top: 0;
        left: 0;

        width: 42px;
        height: 17px;

        background-color: red;

        transform: translateX(169px) translateY(196px);
        transform-origin: center;

        mask-repeat: no-repeat;
        mask-position: center;
        mask-size: 100% 100%;

        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        -webkit-mask-size: 100% 100%;

        image-rendering: pixelated;
      }

      .bg {
        opacity: 0.6;
      }

      #hue {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(
          90deg,
          red 0,
          #ff0 17%,
          lime 33%,
          cyan 50%,
          blue 66%,
          #f0f 83%,
          red
        );
        outline: none;
        margin: 6px 0;
      }
      #saturation {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(90deg, #959595 0, red);
        outline: none;
        margin: 6px 0;
      }
      #brightness {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(90deg, black 0, white);
        outline: none;
        margin: 6px 0;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .slider-row input[type="range"] {
        flex: 1;
      }

      .adjust-btn {
        width: 24px;
        height: 24px;

        font-size: 20px;

        border: none;
        border-radius: 8px;

        background: #555;
        color: white;

        cursor: pointer;
        flex-shrink: 0;
      }

      .adjust-btn:hover {
        background: #777;
      }

      .value-input {
        width: 60px;

        padding: 6px 8px;

        border: none;
        border-radius: 8px;

        background: #444;
        color: white;

        text-align: center;
        font-size: 16px;
      }

      /* Chrome/Safari */
      .value-input::-webkit-outer-spin-button,
      .value-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Firefox */
      .value-input {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body>
    <h1>알파 길드명찰 색상 시뮬</h1>

    <div class="image-wrapper">
      <div class="image-box">
        <img id="toggleImage" src="./img/char_white.png" />
        <div id="img1" class="layer bg" data-mask="./img/bg.png"></div>
        <div id="img2" class="layer" data-mask="./img/text.png"></div>
        <div id="img3" class="layer bg" data-mask="./img/frame.png"></div>
      </div>
      <div class="control-box">
        <button id="zoomToggleBtn" class="zoom-btn">2배 확대</button>
        <button id="otherPictureBtn" class="select-btn2">예시 사진 보기</button>
        <button id="resetSettingsBtn" class="select-btn2">설정 초기화</button>
      </div>
    </div>

    <div class="top-buttons">
      <button class="select-btn active" data-target="img1">배경</button>

      <button class="select-btn" data-target="img2">폰트</button>

      <button class="select-btn" data-target="img3">테두리</button>
    </div>

    <div class="controls">
      <label>※인게임과 값이 다름</label>
      <div class="control-group">
        <div class="label-row">
          <span>색상</span>

          <input
            type="number"
            id="hueValue"
            min="0"
            max="359"
            value="0"
            class="value-input"
          />
        </div>

        <div class="slider-row">
          <button class="adjust-btn" data-target="hue" data-step="-1">-</button>
          <input type="range" id="hue" min="0" max="359" value="0" />
          <button class="adjust-btn" data-target="hue" data-step="1">+</button>
        </div>
      </div>
      <div class="control-group">
        <div class="label-row">
          <span>채도</span>

          <input
            type="number"
            id="saturationValue"
            min="-99"
            max="99"
            value="0"
            class="value-input"
          />
        </div>

        <div class="slider-row">
          <button class="adjust-btn" data-target="saturation" data-step="-1">
            -
          </button>
          <input type="range" id="saturation" min="-99" max="99" value="0" />
          <button class="adjust-btn" data-target="saturation" data-step="1">
            +
          </button>
        </div>
      </div>
      <div class="control-group">
        <div class="label-row">
          <span>명도</span>

          <input
            type="number"
            id="brightnessValue"
            min="-99"
            max="99"
            value="0"
            class="value-input"
          />
        </div>

        <div class="slider-row">
          <button class="adjust-btn" data-target="brightness" data-step="-1">
            -
          </button>
          <input type="range" id="brightness" min="-99" max="99" value="0" />
          <button class="adjust-btn" data-target="brightness" data-step="1">
            +
          </button>
        </div>
      </div>
    </div>

    <script>
      const images = ["./img/char_white.png", "./img/char_other.png"];
      const imageBoxImage = document.querySelectorAll(".layer");
      const layerButtons = document.querySelectorAll(
        ".top-buttons .select-btn",
      );
      const hueInput = document.getElementById("hue");
      const brightnessInput = document.getElementById("brightness");
      const saturationInput = document.getElementById("saturation");
      const hueValue = document.getElementById("hueValue");
      const brightnessValue = document.getElementById("brightnessValue");
      const saturationValue = document.getElementById("saturationValue");
      const otherPictureBtn = document.getElementById("otherPictureBtn");
      const toggleImage = document.getElementById("toggleImage");
      const resetSettingsBtn = document.getElementById("resetSettingsBtn");

      const STORAGE_KEY = "alphasimul_layer_settings_v1";
      const DEFAULT_LAYER_SETTINGS = {
        img1: { name: "배경", hue: 0, brightness: -99, saturation: -99 },
        img2: { name: "폰트", hue: 0, brightness: 99, saturation: -99 },
        img3: { name: "테두리", hue: 0, brightness: -99, saturation: -99 },
      };

      document.querySelectorAll(".layer").forEach((layer) => {
        const maskPath = layer.dataset.mask;
        layer.style.maskImage = `url(${maskPath})`;
        layer.style.webkitMaskImage = `url(${maskPath})`;
      });

      /* --------------------------------- */
      function applyLayerStyle(layerId) {
        const settings = layerSettings[layerId];

        const layer = document.getElementById(layerId);

        if (!layer) return;

        const h = settings.hue;

        const s = ((settings.saturation + 99) / 198) * 100;

        let l = (settings.brightness + 99) / 198;
        if (layerId === "img2") {
          l = l * 100;
        } else {
          l = l * 60;
        }

        layer.style.backgroundColor = `hsl(${h}, ${s}%, ${l}%)`;
      }
      /* --------------------------------- */

      function resetToDefaults() {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        Object.keys(DEFAULT_LAYER_SETTINGS).forEach((k) => {
          if (layerSettings[k])
            Object.assign(layerSettings[k], DEFAULT_LAYER_SETTINGS[k]);
        });
        imageBoxImage.forEach((img) => {
          if (layerSettings[img.id]) applyLayerStyle(img.id);
        });
        updateSliderValues(selectedLayerId);
        saveLayerSettings();
      }

      if (resetSettingsBtn) {
        resetSettingsBtn.addEventListener("click", () => {
          if (confirm("레이어 설정을 초기화하시겠습니까?")) {
            resetToDefaults();
          }
        });
      }

      /* --------------------------------- */

      document.querySelectorAll(".adjust-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.target;
          const step = Number(button.dataset.step);

          const rangeInput = document.getElementById(target);
          const valueInput = document.getElementById(`${target}Value`);

          let value = Number(rangeInput.value) + step;

          const min = Number(rangeInput.min);
          const max = Number(rangeInput.max);

          value = Math.max(min, Math.min(max, value));

          rangeInput.value = value;
          valueInput.value = value;

          syncLayerSetting(target, value);
        });
      });

      /* --------------------------------- */

      function bindNumberInput(numberInput, rangeInput, key) {
        numberInput.addEventListener("input", () => {
          let value = Number(numberInput.value);

          const min = Number(rangeInput.min);
          const max = Number(rangeInput.max);

          value = Math.max(min, Math.min(max, value));

          rangeInput.value = value;
          numberInput.value = value;

          syncLayerSetting(key, value);
        });
      }

      bindNumberInput(hueValue, hueInput, "hue");
      bindNumberInput(saturationValue, saturationInput, "saturation");
      bindNumberInput(brightnessValue, brightnessInput, "brightness");

      /* --------------------------------- */

      const layerSettings = {
        img1: { name: "배경", hue: 0, brightness: 0, saturation: 0 },
        img2: { name: "폰트", hue: 0, brightness: 0, saturation: 0 },
        img3: { name: "테두리", hue: 0, brightness: 0, saturation: 0 },
      };

      function saveLayerSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(layerSettings));
        } catch (e) {}
      }

      function loadLayerSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            resetToDefaults();
            return;
          }
          const parsed = JSON.parse(raw);
          Object.keys(layerSettings).forEach((k) => {
            if (parsed[k]) Object.assign(layerSettings[k], parsed[k]);
          });
        } catch (e) {}
      }

      loadLayerSettings();

      let isOtherImage = false;

      /* --------------------------------- */

      otherPictureBtn.addEventListener("click", () => {
        isOtherImage = !isOtherImage;

        toggleImage.src = isOtherImage
          ? "./img/char_other.png"
          : "./img/char_white.png";

        otherPictureBtn.textContent = isOtherImage
          ? "흰 배경으로 보기"
          : "예시 사진 보기";
      });

      /* --------------------------------- */

      const zoomToggleBtn = document.getElementById("zoomToggleBtn");

      let isZoomed = 0;
      const zoomedOptions = [
        { scale: 1, translateX: 169, translateY: 196 },
        { scale: 2, translateX: 84, translateY: 104 },
        { scale: 4, translateX: 42, translateY: 54 },
      ];
      const sourceZoomedOptions = [
        { scale: 1, translateX: 0, translateY: 0 },
        { scale: 2, translateX: 0, translateY: -60 },
        { scale: 4, translateX: 0, translateY: -200 },
      ];
      const zoomedText = ["2배 확대", "4배 확대", "원래 크기"];
      zoomToggleBtn.addEventListener("click", () => {
        isZoomed = (isZoomed + 1) % 3;
        toggleImage.style.transform = `translateX(${sourceZoomedOptions[isZoomed].translateX}px)
            translateY(${sourceZoomedOptions[isZoomed].translateY}px)
             scale(${sourceZoomedOptions[isZoomed].scale})`;

        imageBoxImage.forEach((img) => {
          img.style.transform = `scale(${zoomedOptions[isZoomed].scale})
            translateX(${zoomedOptions[isZoomed].translateX}px)
            translateY(${zoomedOptions[isZoomed].translateY}px)`;
        });

        zoomToggleBtn.textContent = zoomedText[isZoomed];
      });

      /* --------------------------------- */

      function updateSliderValues(layerId) {
        const settings = layerSettings[layerId];
        if (!settings) return;

        hueInput.value = settings.hue;
        brightnessInput.value = settings.brightness;
        saturationInput.value = settings.saturation;
        hueValue.value = settings.hue;
        brightnessValue.value = settings.brightness;
        saturationValue.value = settings.saturation;
      }

      function setActiveLayerButton(layerId) {
        layerButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.target === layerId);
        });
      }

      let selectedLayerId = "img1";

      layerButtons.forEach((button) => {
        button.addEventListener("click", () => {
          selectedLayerId = button.dataset.target;
          setActiveLayerButton(selectedLayerId);
          updateSliderValues(selectedLayerId);
        });
      });

      function syncLayerSetting(key, value) {
        if (!layerSettings[selectedLayerId]) return;
        layerSettings[selectedLayerId][key] = value;
        applyLayerStyle(selectedLayerId);
        saveLayerSettings();
      }

      hueInput.addEventListener("input", () => {
        const value = Number(hueInput.value);
        hueValue.value = value;
        syncLayerSetting("hue", value);
      });

      brightnessInput.addEventListener("input", () => {
        const value = Number(brightnessInput.value);
        brightnessValue.value = value;
        syncLayerSetting("brightness", value);
      });

      saturationInput.addEventListener("input", () => {
        const value = Number(saturationInput.value);
        saturationValue.value = value;
        syncLayerSetting("saturation", value);
      });

      imageBoxImage.forEach((img) => {
        const id = img.id;
        if (layerSettings[id]) {
          applyLayerStyle(id);
        }
      });

      setActiveLayerButton(selectedLayerId);
      updateSliderValues(selectedLayerId);
    </script>
  </body>
</html>
