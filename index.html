<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>길드명찰 색상 시뮬</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;
        background: #1e1e1e;
        color: white;
        font-family: Arial, sans-serif;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .top-buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .select-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        font-size: 15px;
      }

      .select-btn2 {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        font-size: 15px;
      }

      .zoom-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        font-size: 15px;
      }

      .select-btn.active {
        background: #4f8cff;
      }

      .image-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-bottom: 40px;
      }

      .image-box {
        position: relative;
        width: 380px;
        background: #2b2b2b;
        border-radius: 16px;
        overflow: hidden;
        padding: 12px;
        text-align: center;
      }

      .control-box {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .image-box h3 {
        text-align: center;
        margin-top: 0;
      }

      .controls {
        width: 400px;
        max-width: 95vw;
        margin: auto;
        background: #2b2b2b;
        padding: 24px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }

      .layer-wrapper {
        display: relative;
        position: absolute;
        top: 0;
        left: 0;
        transform: translateX(169px) translateY(196px);
        transform-origin: center;
      }

      .image-box img {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }

      .layer {
        position: absolute;
        top: 0;
        left: 0;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
        z-index: 1;
      }

      .layer-white {
        opacity: 0;
        z-index: 2;
      }

      .bg {
        opacity: 0.6;
      }

      .frame {
        opacity: 0.6;
      }

      #hue {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(
          90deg,
          red 0,
          #ff0 17%,
          lime 33%,
          cyan 50%,
          blue 66%,
          #f0f 83%,
          red
        );
        outline: none;
        margin: 6px 0;
      }
      #saturation {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(90deg, #959595 0, red);
        outline: none;
        margin: 6px 0;
      }
      #brightness {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(90deg, black 0, white);
        outline: none;
        margin: 6px 0;
      }

      #hue::-webkit-slider-thumb,
      #saturation::-webkit-slider-thumb,
      #brightness::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #666;
        margin-top: -8px;
        cursor: pointer;
      }
      #hue::-webkit-slider-runnable-track,
      #saturation::-webkit-slider-runnable-track,
      #brightness::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 8px;
      }

      /* Firefox */
      #hue::-moz-range-track,
      #saturation::-moz-range-track,
      #brightness::-moz-range-track {
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(
          90deg,
          red 0,
          #ff0 17%,
          lime 33%,
          cyan 50%,
          blue 66%,
          #f0f 83%,
          red
        );
      }
      #saturation::-moz-range-track {
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(90deg, #959595 0, red);
      }
      #brightness::-moz-range-track {
        height: 8px;
        border-radius: 8px;
        background-image: linear-gradient(90deg, black 0, white);
      }
      #hue::-moz-range-thumb,
      #saturation::-moz-range-thumb,
      #brightness::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #666;
        cursor: pointer;
      }

      /* IE/Edge */
      #hue::-ms-track,
      #saturation::-ms-track,
      #brightness::-ms-track {
        width: 100%;
        height: 8px;
        background: transparent;
        color: transparent;
      }
      #hue::-ms-fill-lower,
      #hue::-ms-fill-upper {
        background-image: linear-gradient(
          90deg,
          red 0,
          #ff0 17%,
          lime 33%,
          cyan 50%,
          blue 66%,
          #f0f 83%,
          red
        );
        border-radius: 8px;
      }
      #saturation::-ms-fill-lower,
      #saturation::-ms-fill-upper {
        background-image: linear-gradient(90deg, #959595 0, red);
        border-radius: 8px;
      }
      #brightness::-ms-fill-lower,
      #brightness::-ms-fill-upper {
        background-image: linear-gradient(90deg, black 0, white);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>길드명찰 색상 시뮬</h1>

    <!-- 이미지 -->
    <div class="image-wrapper">
      <div class="image-box">
        <img id="toggleImage" src="./img/char_white.png" />
        <div class="layer-wrapper">
          <img
            id="img1-white"
            src="./img/bg_white.png"
            class="layer layer-white"
          />
          <img id="img1" src="./img/bg.png" class="bg layer" />
        </div>
        <div class="layer-wrapper">
          <img
            id="img2-white"
            src="img/text_white.png"
            class="layer layer-white"
          />
          <img id="img2" src="img/text.png" class="text layer" />
        </div>

        <div class="layer-wrapper">
          <img
            id="img3-white"
            src="img/frame_white.png"
            class="layer layer-white"
          />
          <img id="img3" src="img/frame.png" class="frame layer" />
        </div>
      </div>
      <div class="control-box">
        <button id="zoomToggleBtn" class="zoom-btn">2배 확대</button>
        <button id="otherPictureBtn" class="select-btn2">예시 사진 보기</button>
        <button id="resetSettingsBtn" class="select-btn2">설정 초기화</button>
      </div>
    </div>

    <!-- 어떤 사진을 조절할지 선택 -->
    <div class="top-buttons">
      <button class="select-btn active" data-target="img1">배경</button>

      <button class="select-btn" data-target="img2">폰트</button>

      <button class="select-btn" data-target="img3">테두리</button>
    </div>

    <!-- 슬라이더 -->
    <div class="controls">
      <div class="control-group">
        <div class="label-row">
          <span>색상</span>
          <span id="hueValue">0</span>
        </div>
        <input type="range" id="hue" min="0" max="359" value="0" />
      </div>
      <div class="control-group">
        <div class="label-row">
          <span>채도</span>
          <span id="saturationValue">0</span>
        </div>
        <input type="range" id="saturation" min="-99" max="99" value="0" />
      </div>
      <div class="control-group">
        <div class="label-row">
          <span>명도</span>
          <span id="brightnessValue">0</span>
        </div>
        <input type="range" id="brightness" min="-99" max="99" value="0" />
      </div>
    </div>

    <!--------------- 스크립트 --------------->

    <script>
      const images = ["./img/char_white.png", "./img/char.png"];
      const imagesBtn = ["예시 사진 보기", "흰 배경으로 보기"];
      const imageBoxImage = document.querySelectorAll(".layer");
      const layerWrappers = document.querySelectorAll(".layer-wrapper");
      const layerButtons = document.querySelectorAll(
        ".top-buttons .select-btn",
      );
      const hueInput = document.getElementById("hue");
      const brightnessInput = document.getElementById("brightness");
      const saturationInput = document.getElementById("saturation");
      const hueValue = document.getElementById("hueValue");
      const brightnessValue = document.getElementById("brightnessValue");
      const saturationValue = document.getElementById("saturationValue");
      const otherPictureBtn = document.getElementById("otherPictureBtn");
      const toggleImage = document.getElementById("toggleImage");
      const resetSettingsBtn = document.getElementById("resetSettingsBtn");

      const STORAGE_KEY = "alphasimul_layer_settings_v1";
      const DEFAULT_LAYER_SETTINGS = {
        img1: { name: "배경", hue: 0, brightness: 0, saturation: 0 },
        img2: { name: "폰트", hue: 0, brightness: 0, saturation: 0 },
        img3: { name: "테두리", hue: 0, brightness: 0, saturation: 0 },
      };
      /* --------------------------------- */
      function applyLayerStyle(layerId) {
        const settings = layerSettings[layerId];

        const h = settings.hue;
        const s = settings.saturation;
        const b = settings.brightness;

        // 일반 레이어
        const normalLayer = document.getElementById(layerId);

        // white 레이어
        const whiteLayer = document.getElementById(`${layerId}-white`);

        let brightnessPercent = 100;
        let whiteOpacity = 0;

        // -99 ~ 0
        // 일반 레이어 brightness 감소
        if (b <= 0) {
          brightnessPercent = ((b + 99) / 99) * 100;
          whiteOpacity = 0;
        }

        // 1 ~ 99
        // white 레이어 opacity 증가
        else {
          brightnessPercent = 100;
          whiteOpacity = b / 99;
        }

        // 일반 레이어 스타일 적용
        if (normalLayer) {
          normalLayer.style.filter = `
      saturate(${100 + s}%)
      hue-rotate(${h}deg)
      brightness(${brightnessPercent}%)
    `;
        }

        // white 레이어 스타일 적용
        if (whiteLayer) {
          whiteLayer.style.filter = `
      saturate(${100 + s}%)
      hue-rotate(${h}deg)
      brightness(100%)
    `;

          whiteLayer.style.opacity = whiteOpacity;
        }
      }
      /* --------------------------------- */

      function resetToDefaults() {
        // remove stored settings
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        // restore defaults into layerSettings
        Object.keys(DEFAULT_LAYER_SETTINGS).forEach((k) => {
          if (layerSettings[k])
            Object.assign(layerSettings[k], DEFAULT_LAYER_SETTINGS[k]);
        });
        // reapply styles and UI
        imageBoxImage.forEach((img) => {
          if (layerSettings[img.id]) applyLayerStyle(img.id);
          // if image was programmatically recolored, restore original
          try {
            const original =
              img.getAttribute && img.getAttribute("data-original-src");
            if (original) {
              img.src = original;
              img.removeAttribute("data-original-src");
            }
          } catch (e) {}
        });
        updateSliderValues(selectedLayerId);
      }

      if (resetSettingsBtn) {
        resetSettingsBtn.addEventListener("click", () => {
          if (confirm("레이어 설정을 초기화하시겠습니까?")) {
            resetToDefaults();
          }
        });
      }

      /* --------------------------------- */
      const layerSettings = {
        img1: { name: "배경", hue: 0, brightness: 0, saturation: 0 },
        img2: { name: "폰트", hue: 0, brightness: 0, saturation: 0 },
        img3: { name: "테두리", hue: 0, brightness: 0, saturation: 0 },
      };

      function saveLayerSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(layerSettings));
        } catch (e) {
          // ignore
        }
      }

      function loadLayerSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          Object.keys(layerSettings).forEach((k) => {
            if (parsed[k]) Object.assign(layerSettings[k], parsed[k]);
          });
        } catch (e) {
          // ignore
        }
      }

      loadLayerSettings();

      let currentIndex = 0;
      let selectedLayerId = "img1";

      otherPictureBtn.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % images.length;

        toggleImage.src = images[currentIndex];
        otherPictureBtn.textContent = imagesBtn[currentIndex];
      });

      /* --------------------------------- */

      const zoomToggleBtn = document.getElementById("zoomToggleBtn");

      let isZoomed = 0;
      const zoomedOptions = [
        { scale: 1, translateX: 169, translateY: 196 },
        { scale: 2, translateX: 168, translateY: 209 },
        { scale: 4, translateX: 167, translateY: 216 },
      ];
      const sourceZoomedOptions = [
        { scale: 1, translateX: 0, translateY: 0 },
        { scale: 2, translateX: 0, translateY: -60 },
        { scale: 4, translateX: 0, translateY: -200 },
      ];
      const zoomedText = ["2배 확대", "4배 확대", "원래 크기"];
      zoomToggleBtn.addEventListener("click", () => {
        isZoomed = (isZoomed + 1) % 3;
        toggleImage.style.transform = `translateX(${sourceZoomedOptions[isZoomed].translateX}px)
            translateY(${sourceZoomedOptions[isZoomed].translateY}px)
             scale(${sourceZoomedOptions[isZoomed].scale})`;

        imageBoxImage.forEach((img) => {
          img.style.transform = `scale(${zoomedOptions[isZoomed].scale})`;
        });

        layerWrappers.forEach((layer) => {
          layer.style.transform = `translateX(${zoomedOptions[isZoomed].translateX}px)
            translateY(${zoomedOptions[isZoomed].translateY}px)`;
        });

        zoomToggleBtn.textContent = zoomedText[isZoomed];
      });

      /* --------------------------------- */

      function updateSliderValues(layerId) {
        const settings = layerSettings[layerId];
        if (!settings) return;

        hueInput.value = settings.hue;
        brightnessInput.value = settings.brightness;
        saturationInput.value = settings.saturation;
        hueValue.textContent = `${settings.hue}`;
        brightnessValue.textContent = `${settings.brightness}`;
        saturationValue.textContent = `${settings.saturation}`;
      }

      function setActiveLayerButton(layerId) {
        layerButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.target === layerId);
        });
      }

      layerButtons.forEach((button) => {
        button.addEventListener("click", () => {
          selectedLayerId = button.dataset.target;
          setActiveLayerButton(selectedLayerId);
          updateSliderValues(selectedLayerId);
        });
      });

      function syncLayerSetting(key, value) {
        if (!layerSettings[selectedLayerId]) return;
        layerSettings[selectedLayerId][key] = value;
        applyLayerStyle(selectedLayerId);
        saveLayerSettings();
      }

      hueInput.addEventListener("input", () => {
        const value = Number(hueInput.value);
        hueValue.textContent = `${value}`;
        syncLayerSetting("hue", value);
      });

      brightnessInput.addEventListener("input", () => {
        const value = Number(brightnessInput.value);
        brightnessValue.textContent = `${value}`;
        syncLayerSetting("brightness", value);
      });

      saturationInput.addEventListener("input", () => {
        const value = Number(saturationInput.value);
        saturationValue.textContent = `${value}`;
        syncLayerSetting("saturation", value);
      });

      imageBoxImage.forEach((img) => {
        const id = img.id;
        if (layerSettings[id]) {
          applyLayerStyle(id);
        }
      });

      setActiveLayerButton(selectedLayerId);
      updateSliderValues(selectedLayerId);
    </script>
  </body>
</html>
